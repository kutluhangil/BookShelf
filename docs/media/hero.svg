 r="0.9" fill="#fff" style="animation:tw 2.7s ease-in-out 0.8s infinite"/><circle cx="1106.7" cy="188.6" r="1.1" fill="#fff" style="animation:tw 2.8s ease-in-out 1.5s infinite"/><circle cx="837" cy="319" r="1.3" fill="#fff" style="animation:tw 3.1s ease-in-out 0.2s infinite"/><circle cx="887.9" cy="260.4" r="1.9" fill="#fff" style="animation:tw 1.9s ease-in-out 1.8s infinite"/><circle cx="844.7" cy="339.3" r="0.7" fill="#fff" style="animation:tw 3.9s ease-in-out 0.8s infinite"/><circle cx="1020.7" cy="317.7" r="0.8" fill="#fff" style="animation:tw 2.5s ease-in-out 0.2s infinite"/><circle cx="1028.8" cy="214.7" r="0.8" fill="#fff" style="animation:tw 2s ease-in-out 1s infinite"/></g>
